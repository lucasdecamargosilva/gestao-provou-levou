<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Escritório · Provou Levou</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env-config.js"></script>
<style>
  @font-face{font-family:'HelveticaNow';src:url('helveticanowdisplay-medium.ttf') format('truetype');font-display:swap}
  :root{
    --bg:#e9e5f2; --card:#ffffff; --linha:rgba(23,18,31,.11);
    --ink:#17121f; --ink2:rgba(23,18,31,.74); --ink3:rgba(23,18,31,.58);
    --roxo:#7c3aed; --lilas:#a78bfa; --destaque:#6d28d9; --verde:#0d9668; --vermelho:#c2410c;
    --fonte:'HelveticaNow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fonte);-webkit-font-smoothing:antialiased}
  #cena{position:fixed;inset:0} #cena canvas{display:block;cursor:grab}

  /* selos das salas (mesmo desenho da arte: moeda + barra verde) */
  .selo{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.96);border:1px solid rgba(124,58,237,.18);border-radius:999px;padding:5px 11px 5px 5px;
    box-shadow:0 4px 14px rgba(76,29,149,.16);cursor:pointer;white-space:nowrap;pointer-events:auto;transition:box-shadow .2s;animation:flutua 3.6s ease-in-out infinite}
  .selo:hover,.selo.sel{box-shadow:0 0 0 3px rgba(124,58,237,.22),0 6px 18px rgba(76,29,149,.2)}
  .selo .nv{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#3b2a00;
    background:radial-gradient(circle at 35% 30%,#fff3b0,#f5c542 55%,#d99a0b);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
  .selo .txt{display:flex;flex-direction:column;gap:3px}
  .selo .nome{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .selo .trilho{width:96px;height:7px;border-radius:9px;background:#e6e1f2;overflow:hidden}
  .selo .trilho i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#34d399,#10b981);transform:scaleX(0);transform-origin:left;transition:transform .9s}
  .selo .kpi{font-size:11.5px;color:var(--ink2)}
  .placar{background:rgba(76,29,149,.85);color:#fff;border:1px solid rgba(216,199,255,.7);border-radius:14px;padding:8px 14px 9px;text-align:center;cursor:pointer;pointer-events:auto;
    box-shadow:0 10px 30px rgba(76,29,149,.35),0 0 24px rgba(167,139,250,.55);white-space:nowrap;animation:flutua 4s ease-in-out infinite}
  .placar small{display:block;font-size:12px;opacity:.85} .placar b{display:block;font-size:25px;letter-spacing:-.03em;font-weight:600;font-variant-numeric:tabular-nums} .placar i{font-style:normal;font-size:12px}
  @keyframes flutua{0%,100%{translate:0 0}50%{translate:0 -6px}}

  .hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .marca{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid var(--linha);border-radius:16px;padding:12px 16px;min-width:240px;box-shadow:0 6px 24px rgba(76,29,149,.10)}
  .marca b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
  .marca small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
  .nivel-emp{display:flex;align-items:center;gap:10px;margin-top:10px}
  .pill{background:linear-gradient(135deg,var(--lilas),var(--roxo));color:#fff;font-weight:700;font-size:12.5px;border-radius:10px;padding:5px 9px;white-space:nowrap}
  .barra{flex:1;height:7px;border-radius:9px;background:rgba(124,58,237,.14);overflow:hidden;min-width:90px}
  .barra i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--lilas),var(--roxo));transform:scaleX(0);transform-origin:left;transition:transform .8s}
  .acoes{display:flex;gap:8px}
  .btn{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid var(--linha);color:var(--ink2);font:inherit;font-size:12.5px;padding:9px 13px;border-radius:11px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:rgba(124,58,237,.4);color:var(--roxo)}
  .ajuda{position:fixed;left:16px;bottom:16px;font-size:11.5px;color:var(--ink3);background:rgba(255,255,255,.8);border-radius:10px;padding:7px 10px;z-index:4}
  /* Painel que afunila: área → tópico → loja */
  .painel{position:fixed;top:16px;right:16px;bottom:16px;width:420px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border:1px solid var(--linha);
    border-radius:18px;box-shadow:0 18px 50px rgba(76,29,149,.18);transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
  .painel.aberto{transform:none}
  .painel header{padding:14px 18px 12px;border-bottom:1px solid var(--linha)}
  .trilha{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--ink3);margin-bottom:6px;min-height:18px}
  .trilha button{background:none;border:0;padding:0;font:inherit;color:var(--roxo);cursor:pointer}
  .trilha span.sep{opacity:.5}
  .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .painel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .painel header small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}
  .painel .fechar{background:none;border:0;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1;padding:2px 4px}
  .painel .corpo{padding:14px 18px 18px;overflow:auto;flex:1}
  .painel footer{padding:12px 18px;border-top:1px solid var(--linha)}
  .painel footer a{display:block;text-align:center;background:var(--roxo);color:#fff;text-decoration:none;border-radius:11px;padding:11px;font-size:13.5px;font-weight:600}
  .painel footer a:hover{background:var(--destaque)}
  .nivel-area{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kp{background:#faf8ff;border:1px solid var(--linha);border-radius:12px;padding:12px;text-align:left;font:inherit;color:inherit}
  button.kp{cursor:pointer;transition:border-color .2s,transform .2s}
  button.kp:hover{border-color:rgba(124,58,237,.5);transform:translateY(-1px)}
  button.kp .mais{float:right;color:var(--roxo);font-size:12px;opacity:.7}
  .kp .n{display:block;font-size:21px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .kp .l{display:block;font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.35}
  .kp .v{font-size:11px;margin-top:4px;display:block}
  .v.up{color:var(--verde)} .v.down{color:var(--vermelho)}
  .kp.largo{grid-column:1/-1}
  .secao{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
  .topicos{display:flex;flex-direction:column;gap:6px}
  .topico{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--linha);border-radius:11px;padding:11px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink);text-align:left}
  .topico:hover{border-color:rgba(124,58,237,.5);color:var(--roxo)}
  .topico span{color:var(--ink3);font-size:12px}
  .dica{margin-top:14px;background:#f5f0ff;border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
  .dica b{color:var(--destaque)}
  .busca{width:100%;border:1px solid var(--linha);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;margin-bottom:10px;outline:none}
  .busca:focus{border-color:var(--roxo)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:500;color:var(--ink3);font-size:11px;padding:6px 6px;border-bottom:1px solid var(--linha);cursor:pointer;white-space:nowrap;position:sticky;top:-14px;background:#fff}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:8px 6px;border-bottom:1px solid rgba(23,18,31,.06);vertical-align:top;word-break:break-word}
  tr.clicavel{cursor:pointer} tr.clicavel:hover td{background:#f7f3ff}
  tr.clicavel td:first-child{color:var(--destaque)}
  .vazio{color:var(--ink3);font-size:13px;padding:20px 0;text-align:center}
  .grafico{display:flex;align-items:flex-end;gap:3px;height:140px;margin:6px 0 4px}
  .grafico div{flex:1;background:linear-gradient(180deg,var(--lilas),var(--roxo));border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .grafico div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--linha);border-radius:7px;padding:4px 7px;font-size:11px;white-space:nowrap;margin-bottom:4px;z-index:2}
  .eixo{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-bottom:10px}
  .carregando{color:var(--ink3);font-size:13px;padding:18px 0}


  .aviso{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--bg);font-size:14px;color:var(--ink2);text-align:center;padding:24px}
  .aviso a{color:var(--roxo)}
  @media (max-width:700px){
    .marca{min-width:0;flex:1}
    .acoes .btn.oculta-mob,.ajuda{display:none}
    .painel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;height:70vh;transform:translateY(calc(100% + 30px))}
    .selo{scale:.78} .selo .kpi{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .selo,.placar{animation:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="cena"></div>
<div class="hud">
  <div class="marca">
    <b>Provou Levou · Escritório</b>
    <small id="atualizado">Carregando os números…</small>
    <div class="nivel-emp"><span class="pill" id="nivel-emp">Nível –</span><div class="barra"><i id="barra-emp"></i></div></div>
  </div>
  <div class="acoes">
    <button class="btn" id="btn-visao">Visão geral</button>
    <button class="btn" id="btn-atualizar">Atualizar</button>
    <a class="btn oculta-mob" href="index.html">Painel de gestão</a>
  </div>
</div>
<div class="ajuda">Clique numa sala · clique nos números para ir afunilando · arraste para girar · botão direito para andar · role para aproximar</div>
<aside class="painel" id="painel" aria-live="polite">
  <header>
    <nav class="trilha" id="trilha"></nav>
    <div class="cab"><div><h2 id="p-titulo">–</h2><small id="p-sub"></small></div><button class="fechar" id="p-fechar" aria-label="Fechar">×</button></div>
  </header>
  <div class="corpo" id="p-corpo"></div>
  <footer id="p-rodape"></footer>
</aside>
<div class="aviso" id="aviso">Carregando o escritório…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
// ───────────────────────── util ─────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const brl2 = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => Number(v || 0).toLocaleString('pt-BR');
const pct = (a, b) => (!b ? null : Math.round((a / b - 1) * 100));
const data = v => { if (!v) return '—'; const d = new Date(String(v).length <= 10 ? v + 'T12:00' : v); return isNaN(d) ? esc(v) : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }); };
const quando = v => { if (!v) return '—'; const d = new Date(v); const h = (Date.now() - d) / 36e5; return h < 1 ? 'agora há pouco' : h < 24 ? 'há ' + Math.round(h) + 'h' : 'há ' + Math.round(h / 24) + ' dias'; };
const var_ = v => v == null ? '' : '<span class="v ' + (v >= 0 ? 'up' : 'down') + '">' + (v >= 0 ? '▲ ' : '▼ ') + Math.abs(v) + '%</span>';
const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1';
const db = window.supabase.createClient(window.LOCAL_SUPABASE_URL, window.LOCAL_SUPABASE_KEY);

// ───────────────── níveis (período atual × anterior) ─────────────────
function nivelPorRazao(r) {
  if (r == null || !isFinite(r)) return { n: 3, p: .5 };
  const f = [0, .75, .95, 1.05, 1.25, 1.6]; let n = 1;
  for (let i = 1; i < 5; i++) if (r >= f[i]) n = i + 1;
  return { n, p: Math.max(.08, Math.min(1, (r - f[n - 1]) / (f[n] - f[n - 1]))) };
}
const razao = (a, b) => (b > 0 ? a / b : (a > 0 ? 1.3 : null));
function calculaAreas(d) {
  const f = d.financeiro, pv = d.provador, mk = d.marketing, cm = d.comercial, at = d.atendimento;
  const rMk = [razao(mk.seo.cliques_28d, mk.seo.cliques_28d_ant), razao(mk.ads.leads_7d, mk.ads.leads_7d_ant)].filter(x => x != null);
  const taxa = at.disparos_7d ? at.entregues_7d / at.disparos_7d : null;
  const ret = (at.lojas_ativas + at.lojas_inativas) ? at.lojas_ativas / (at.lojas_ativas + at.lojas_inativas) : null;
  return {
    financeiro: { nivel: nivelPorRazao(razao(f.receita_mes, f.receita_mes_ant_ate_hoje)), kpi: brl(f.receita_mes) + ' no mês' },
    marketing: { nivel: nivelPorRazao(rMk.length ? rMk.reduce((a, b) => a + b, 0) / rMk.length : null), kpi: num(mk.ads.leads_7d) + ' leads (7d)' },
    comercial: { nivel: nivelPorRazao(razao(cm.clientes_novos_30d, cm.clientes_novos_30d_ant)), kpi: cm.clientes_novos_30d + ' clientes novos' },
    atendimento: { nivel: nivelPorRazao(taxa == null ? ret / .85 : ((taxa / .9) + (ret / .85)) / 2), kpi: at.lojas_ativas + ' lojas ativas' },
    provador: { nivel: nivelPorRazao(razao(pv.provas_30d, pv.provas_30d_ant)), kpi: num(pv.provas_hoje) + ' provas hoje' }
  };
}

// ═════════════════════════ CENA 3D ═════════════════════════
// Planta fiel à arte escolhida (vista isométrica de cima, câmera no sudeste):
// fundo-esquerda = Financeiro (roxo) · fundo-direita = Marketing e CRM (azul)
// esquerda = Provador (rosa) · centro = saguão de madeira com holograma
// direita-baixo = Atendimento (verde) · frente = Recepção (portas de vidro + elevadores)
const host = $('cena');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .92;
host.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
host.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e5f2');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// câmera ortográfica "maquete" (igual ao ângulo da arte)
let VIEW = 21;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
const DIR_CASA = new THREE.Vector3(1, 0.92, 1).normalize();
const ALVO_CASA = new THREE.Vector3(0, 0, 1.5);
function enquadra() {
  const a = innerWidth / innerHeight;
  VIEW = Math.max(17, 27 / a);
  Object.assign(camera, { left: -VIEW * a, right: VIEW * a, top: VIEW, bottom: -VIEW });
  camera.updateProjectionMatrix();
}
enquadra();
const zoomCasa = () => (innerWidth < 700 && innerHeight > innerWidth ? 2.1 : 1); // celular em pé abre aproximado
camera.position.copy(ALVO_CASA).addScaledVector(DIR_CASA, 90); camera.zoom = zoomCasa(); camera.updateProjectionMatrix();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(ALVO_CASA);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minZoom = .75; controls.maxZoom = 6;
controls.minPolarAngle = .55; controls.maxPolarAngle = 1.12;
const AZ0 = Math.atan2(DIR_CASA.x, DIR_CASA.z);
controls.minAzimuthAngle = AZ0 - .95; controls.maxAzimuthAngle = AZ0 + .95;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight('#ffffff', '#cbbbe8', .5));
const preench = new THREE.DirectionalLight('#f3eeff', .9); preench.position.set(30, 22, 30); scene.add(preench); // clareia as paredes viradas pra câmera
const sol = new THREE.DirectionalLight('#fff3e6', 2.5);
sol.position.set(-14, 34, 22); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096);
Object.assign(sol.shadow.camera, { left: -34, right: 34, top: 30, bottom: -30, near: 1, far: 90 });
sol.shadow.bias = -0.00025; sol.shadow.normalBias = .02; sol.shadow.radius = 4;
scene.add(sol);

// ───────────── materiais ─────────────
const MAT = {};
const mat = (cor, o = {}) => MAT[cor + JSON.stringify(o)] || (MAT[cor + JSON.stringify(o)] = new THREE.MeshStandardMaterial(Object.assign({ color: cor, roughness: .78, metalness: 0, envMapIntensity: .55 }, o)));
const C = {
  parede: '#f4f0f8', paredeTopo: '#ebe4f4', roxo: '#7b3fe4', roxoEsc: '#6a31d1',
  fin: '#a58ae8', mk: '#8fb1e6', crm: '#9dbbea', at: '#a9dcbf', prov: '#efb6cd', rec: '#eef0f4',
  mesa: '#fbf8f3', mesaBorda: '#e9dfd0', cinza: '#c9c6d3', escuro: '#2b2a3d', verde: '#5aa86f', verde2: '#3f8f5a', vaso: '#f3efe9', ouro: '#d8b26a'
};

// ───────────── texturas procedurais ─────────────
function canvasTex(w, h, desenha) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); desenha(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.userData = { c, x, desenha }; return t;
}
const pisoMadeira = canvasTex(1024, 1024, (x, w, h) => {
  x.fillStyle = '#e3b88c'; x.fillRect(0, 0, w, h);
  const lin = 12; for (let i = 0; i < lin; i++) { for (let j = 0; j < 4; j++) {
    const off = (i % 2) * 128; const tom = 205 + ((i * 37 + j * 53) % 30);
    x.fillStyle = 'rgb(' + (tom + 22) + ',' + (tom - 22) + ',' + (tom - 70) + ')';
    x.fillRect(j * 256 - off, i * (h / lin), 254, h / lin - 3);
    x.fillRect(j * 256 - off + 1024, i * (h / lin), 254, h / lin - 3);
    x.strokeStyle = 'rgba(120,70,30,.08)'; for (let k = 0; k < 6; k++) { x.beginPath(); x.moveTo(j * 256 - off, i * (h / lin) + 10 + k * 12); x.bezierCurveTo(j * 256 - off + 80, i * (h / lin) + 6 + k * 12, j * 256 - off + 160, i * (h / lin) + 16 + k * 12, j * 256 - off + 254, i * (h / lin) + 10 + k * 12); x.stroke(); }
  } }
});
pisoMadeira.wrapS = pisoMadeira.wrapT = THREE.RepeatWrapping; pisoMadeira.repeat.set(3, 3);
const pisoCarpete = cor => { const t = canvasTex(256, 256, (x, w, h) => { x.fillStyle = cor; x.fillRect(0, 0, w, h); for (let i = 0; i < 1800; i++) { x.fillStyle = 'rgba(255,255,255,' + (Math.random() * .06) + ')'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); x.fillStyle = 'rgba(0,0,0,' + (Math.random() * .04) + ')'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); return t; };

function atualizaPessoas(dt, t) {

  fin_pagamentos: { t: 'Pagamentos do mês', cols: [['loja','Loja'],['valor','Valor','brl2'],['data','Data','data'],['tipo','Tipo']] },
  fin_meses: { t: 'Receita por mês', graf: ['mes','total','brl'], cols: [['mes','Mês'],['total','Recebido','brl'],['clientes','Clientes','num']] },
  fin_fluxo: { t: 'Fluxo de caixa', cols: [['mes','Mês'],['receita_bruta','Receita','brl'],['custo_provas','Custo provas','brl'],['lucro_negocio','Lucro','brl']] },
  fin_atrasados: { t: 'Pagamentos atrasados', cols: [['loja','Loja'],['plano','Plano'],['ultimo_pagamento','Último pgto','data'],['dias','Dias','num']] },
  prov_lojas: { t: 'Provas por loja', cols: [['loja','Loja'],['provas_30d','30 dias','num'],['provas_7d','7 dias','num'],['provas_hoje','Hoje','num'],['custo_30d','Custo','brl']] },
  prov_dias: { t: 'Provas por dia', graf: ['dia','provas','num'], cols: [['dia','Dia','data'],['provas','Provas','num']] },
  mk_campanhas: { t: 'Campanhas (30 dias)', cols: [['campanha','Campanha'],['gasto','Gasto','brl'],['leads','Leads','num'],['custo_por_lead','Custo/lead','brl2']] },
  mk_consultas: { t: 'O que buscam no Google', cols: [['consulta','Busca'],['cliques','Cliques','num'],['impressoes','Vezes vista','num'],['posicao','Posição','dec']] },
  mk_paginas: { t: 'Páginas mais vistas no Google', cols: [['pagina','Página','url'],['cliques','Cliques','num'],['impressoes','Vezes vista','num'],['posicao','Posição','dec']] },
  mk_seo_dias: { t: 'Cliques do Google por dia', graf: ['dia','cliques','num'], cols: [['dia','Dia','data'],['cliques','Cliques','num'],['impressoes','Vezes vista','num']] },
  com_testes: { t: 'Lojas em teste grátis', cols: [['loja','Loja'],['dias','Dias','num'],['provas_7d','Provas 7d','num'],['plataforma','Plataforma']] },
  com_novos: { t: 'Clientes novos (90 dias)', cols: [['loja','Loja'],['primeiro_pagamento','1º pgto','data'],['plano','Plano'],['pago_ate_hoje','Já pagou','brl']] },
  com_leads_dias: { t: 'Leads por dia (WhatsApp comercial)', graf: ['dia','leads','num'], cols: [['dia','Dia','data'],['leads','Leads','num']] },
  at_ativas: { t: 'Lojas ativas', cols: [['loja','Loja'],['plano','Plano'],['provas_7d','Provas 7d','num'],['ultima_prova','Última prova','quando']] },
  at_risco: { t: 'Lojas em risco', cols: [['loja','Loja'],['motivo','Motivo'],['provas_7d','Provas 7d','num']] },
  at_saidas: { t: 'Lojas que saíram', cols: [['loja','Loja'],['plano','Plano'],['atualizado','Saída','data']] },
  at_whatsapp: { t: 'WhatsApp por loja (7 dias)', cols: [['email','Loja (login)'],['enviados','Enviados','num'],['entregues','Entregues','num'],['falharam','Falhas','num']] }
};
const FMT = {
  brl: v => brl(v), brl2: v => brl2(v), num: v => num(v), data: v => data(v), quando: v => quando(v),
  dec: v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }),
  url: v => esc(String(v || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '') || '/')
};
function cartao(n, l, v, topico, largo) {
  const tag = topico ? 'button' : 'div';
  return '<' + tag + ' class="kp' + (largo ? ' largo' : '') + '"' + (topico ? ' data-topico="' + topico + '"' : '') + '>' + (topico ? '<span class="mais">ver ›</span>' : '') +
    '<span class="n">' + esc(n) + '</span><span class="l">' + esc(l) + '</span>' + var_(v) + '</' + tag + '>';
}
function resumoArea(key, d) {
  const f = d.financeiro, pv = d.provador, mk = d.marketing, cm = d.comercial, at = d.atendimento;
  if (key === 'financeiro') return {
    html: cartao(brl(f.receita_mes), 'recebido este mês · ver pagamentos', pct(f.receita_mes, f.receita_mes_ant_ate_hoje), 'fin_pagamentos', true) +
      cartao(brl(f.receita_mes_ant), 'mês passado inteiro', null, 'fin_meses') + cartao(brl(f.recebido_30d), 'últimos 30 dias', null, 'fin_meses') +
      cartao(num(f.pagamentos_mes), 'pagamentos no mês', null, 'fin_pagamentos') + cartao(f.lucro_ultimo_mes != null ? brl(f.lucro_ultimo_mes) : '—', 'lucro do último mês fechado', null, 'fin_fluxo'),
    mais: ['fin_meses', 'fin_fluxo', 'fin_atrasados'],
    dica: pct(f.receita_mes, f.receita_mes_ant_ate_hoje) < 0 ? 'O mês está <b>abaixo</b> do mesmo período do mês passado. Veja <b>Pagamentos atrasados</b>.' : 'O mês está <b>acima</b> do mesmo período do mês passado.',
    link: ['index.html#pagamentos', 'Abrir o financeiro completo']
  };
  if (key === 'provador') return {
    html: cartao(num(pv.provas_hoje), 'provas hoje', null, 'prov_dias') + cartao(num(pv.provas_7d), 'últimos 7 dias', null, 'prov_dias') +
      cartao(num(pv.provas_30d), 'últimos 30 dias', pct(pv.provas_30d, pv.provas_30d_ant), 'prov_dias') + cartao(num(pv.lojas_com_prova_7d), 'lojas com prova na semana', null, 'prov_lojas') +
      cartao(brl(pv.custo_30d), 'custo estimado das provas (30d) · por loja', null, 'prov_lojas', true),
    mais: ['prov_lojas', 'prov_dias'],
    dica: 'O custo é estimado em <b>R$ 0,25 por prova</b>. Clique numa loja da lista para ver a ficha dela.',
    link: ['index.html#dashboard', 'Abrir provas no painel']
  };
  if (key === 'marketing') return {
    html: cartao(num(mk.ads.leads_7d), 'leads dos anúncios (7d)', pct(mk.ads.leads_7d, mk.ads.leads_7d_ant), 'mk_campanhas') + cartao(brl(mk.ads.gasto_7d), 'investido em anúncios (7d)', pct(mk.ads.gasto_7d, mk.ads.gasto_7d_ant), 'mk_campanhas') +
      cartao(num(mk.seo.cliques_28d), 'cliques do Google (28d)', pct(mk.seo.cliques_28d, mk.seo.cliques_28d_ant), 'mk_seo_dias') + cartao(mk.seo.posicao_media != null ? String(mk.seo.posicao_media).replace('.', ',') : '—', 'posição média no Google', null, 'mk_consultas'),
    mais: ['mk_campanhas', 'mk_consultas', 'mk_paginas', 'mk_seo_dias'],
    dica: (Number(mk.ads.gasto_7d) === 0 ? '<b>Anúncios parados:</b> nenhum gasto nos últimos 7 dias. ' : '') + (mk.seo.ultimo_dia ? 'Dados do Google até <b>' + data(mk.seo.ultimo_dia) + '</b>.' : ''),
    link: ['trafego.html', 'Abrir painel de tráfego']
  };
  if (key === 'comercial') return {
    html: cartao(num(cm.leads_30d), 'leads no WhatsApp comercial (30d)', pct(cm.leads_30d, cm.leads_30d_ant), 'com_leads_dias') + cartao(num(cm.clientes_novos_30d), 'clientes novos pagantes (30d)', pct(cm.clientes_novos_30d, cm.clientes_novos_30d_ant), 'com_novos') +
      cartao(num(cm.em_teste), 'lojas em teste grátis', null, 'com_testes') + cartao(num(cm.testes_novos_30d), 'testes novos (30d)', null, 'com_testes'),
    mais: ['com_testes', 'com_novos', 'com_leads_dias'],
    dica: 'Os testes com <b>mais provas</b> aparecem primeiro: são os mais prontos pra fechar.',
    link: ['index.html#metas', 'Abrir metas comerciais']
  };
  return {
    html: cartao(num(at.lojas_ativas), 'lojas ativas pagando', null, 'at_ativas') + cartao(num(at.lojas_inativas), 'lojas que saíram', null, 'at_saidas') +
      cartao(num(at.entregues_7d), 'mensagens entregues (7d)', null, 'at_whatsapp') + cartao(at.disparos_7d ? Math.round(at.entregues_7d / at.disparos_7d * 100) + '%' : '—', 'taxa de entrega do WhatsApp', null, 'at_whatsapp') +
      cartao(num(at.respostas_7d), 'respostas de clientes (7d)', null, 'at_whatsapp', true),
    mais: ['at_risco', 'at_ativas', 'at_saidas', 'at_whatsapp'],
    dica: '<b>Lojas em risco</b> = ativas sem prova na semana ou com pagamento atrasado. É por onde começar.',
    link: ['index.html#pagamentos', 'Abrir clientes']
  };
}

// pilha de navegação: [{tipo:'area',key}, {tipo:'topico',id}, {tipo:'loja',id,nome}]
let pilha = [];
const painel = $('painel');
function abreArea(key) { pilha = [{ tipo: 'area', key }]; render(); focaArea(AREAS.find(a => a.key === key)); marcaSel(key); }
function abreGeral() { pilha = [{ tipo: 'geral' }]; render(); marcaSel(null); voaPara(casa()); }
function vaiPara(item) { pilha.push(item); render(); }
function volta(i) { pilha = pilha.slice(0, i + 1); render(); }
function marcaSel(key) { AREAS.forEach(a => { a.el.classList.toggle('sel', a.key === key); a.selos.forEach(s => s.classList.toggle('sel', a.key === key)); }); }
function fecha() { painel.classList.remove('aberto'); pilha = []; marcaSel(null); voaPara(casa()); }
$('p-fechar').addEventListener('click', fecha); $('btn-visao').addEventListener('click', fecha);
$('btn-atualizar').addEventListener('click', carrega);

function nomeDe(item) {
  if (item.tipo === 'geral') return 'Visão geral';
  if (item.tipo === 'area') return AREAS.find(a => a.key === item.key).nome;
  if (item.tipo === 'topico') return TOPICOS[item.id].t;
  return item.nome || 'Loja';
}
async function render(soAtualiza) {
  if (!DADOS || !pilha.length) return;
  const topo = pilha[pilha.length - 1];
  $('trilha').innerHTML = pilha.length > 1 ? pilha.map((it, i) => i < pilha.length - 1 ? '<button data-i="' + i + '">' + esc(nomeDe(it)) + '</button><span class="sep">›</span>' : '').join('') : '';
  $('trilha').querySelectorAll('button').forEach(b => b.addEventListener('click', () => volta(+b.dataset.i)));
  painel.classList.add('aberto');
  const corpo = $('p-corpo'), rod = $('p-rodape');
  if (topo.tipo === 'geral') {
    const areas = calculaAreas(DADOS);
    $('p-titulo').textContent = 'Visão geral da empresa'; $('p-sub').textContent = 'Como cada área está hoje';
    corpo.innerHTML = '<div class="kpis">' + cartao(brl(DADOS.financeiro.receita_mes), 'faturamento do mês', pct(DADOS.financeiro.receita_mes, DADOS.financeiro.receita_mes_ant_ate_hoje), null, true) + '</div>' +
      '<div class="secao">Áreas</div><div class="topicos">' + AREAS.map(a => '<button class="topico" data-area="' + a.key + '">' + esc(a.nome) + '<span>Nível ' + areas[a.key].nivel.n + ' · ' + esc(areas[a.key].kpi) + ' ›</span></button>').join('') + '</div>' +
      '<div class="dica">O nível de cada área compara o período atual com o anterior: <b>3</b> é estável, <b>4–5</b> está crescendo, <b>1–2</b> está caindo.</div>';
    corpo.querySelectorAll('[data-area]').forEach(b => b.addEventListener('click', () => abreArea(b.dataset.area)));
    rod.innerHTML = '<a href="index.html">Abrir painel de gestão →</a>';
    return;
  }
  if (topo.tipo === 'area') {
    const a = AREAS.find(x => x.key === topo.key), ar = calculaAreas(DADOS)[topo.key], c = resumoArea(topo.key, DADOS);
    $('p-titulo').textContent = a.nome; $('p-sub').textContent = a.sub;
    corpo.innerHTML = '<div class="nivel-area"><span class="pill">Nível ' + ar.nivel.n + '</span><div class="barra"><i style="transform:scaleX(' + ar.nivel.p.toFixed(2) + ')"></i></div></div>' +
      '<div class="kpis">' + c.html + '</div>' +
      '<div class="secao">Aprofundar</div><div class="topicos">' + c.mais.map(t => '<button class="topico" data-topico="' + t + '">' + esc(TOPICOS[t].t) + '<span>›</span></button>').join('') + '</div>' +
      (c.dica ? '<div class="dica">' + c.dica + '</div>' : '');
    corpo.querySelectorAll('[data-topico]').forEach(b => b.addEventListener('click', () => vaiPara({ tipo: 'topico', id: b.dataset.topico })));
    rod.innerHTML = '<a href="' + c.link[0] + '">' + esc(c.link[1]) + ' →</a>';
    return;
  }
  rod.innerHTML = '';
  if (topo.tipo === 'topico') {
    const cfg = TOPICOS[topo.id];
    $('p-titulo').textContent = cfg.t; $('p-sub').textContent = nomeDe(pilha[0]);
    if (!soAtualiza) corpo.innerHTML = '<div class="carregando">Carregando…</div>';
    let linhas;
    try { linhas = await rpc('pl_escritorio_detalhe', { p_topico: topo.id }); } catch (e) { corpo.innerHTML = '<div class="vazio">Não consegui carregar: ' + esc(e.message) + '</div>'; return; }
    if (pilha[pilha.length - 1] !== topo) return; // usuário já navegou
    tabela(corpo, cfg, linhas || []);
    return;
  }
  if (topo.tipo === 'loja') {
    $('p-titulo').textContent = topo.nome || 'Loja'; $('p-sub').textContent = 'Ficha da loja';
    corpo.innerHTML = '<div class="carregando">Carregando…</div>';
    let l; try { l = await rpc('pl_escritorio_loja', { p_loja_id: topo.id }); } catch (e) { corpo.innerHTML = '<div class="vazio">Não consegui carregar: ' + esc(e.message) + '</div>'; return; }
    if (pilha[pilha.length - 1] !== topo) return;
    if (!l) { corpo.innerHTML = '<div class="vazio">Loja não encontrada.</div>'; return; }
    const pagos = (l.pagamentos || []).reduce((s, p) => s + Number(p.valor || 0), 0);
    corpo.innerHTML = '<div class="kpis">' + cartao(esc(l.status || '—'), 'status · plano ' + (l.plano || '—')) + cartao(num(l.provas_30d), 'provas em 30 dias') +
      cartao(brl(pagos), 'total já pago · ' + (l.pagamentos || []).length + ' pagamentos') + cartao(data(l.ultimo_pagamento), 'último pagamento') + '</div>' +
      '<div class="secao">Provas por dia (30 dias)</div>' + grafico(l.provas_dias || [], 'dia', 'provas', num) +
      '<div class="secao">Pagamentos</div>' + ((l.pagamentos || []).length ? '<table><thead><tr><th>Data</th><th class="num">Valor</th><th>Tipo</th></tr></thead><tbody>' +
        l.pagamentos.map(p => '<tr><td>' + data(p.data) + '</td><td class="num">' + brl2(p.valor) + '</td><td>' + esc(p.tipo || '') + '</td></tr>').join('') + '</tbody></table>' : '<div class="vazio">Nenhum pagamento registrado.</div>') +
      '<div class="dica">Contato: <b>' + esc(l.contato || '—') + '</b> · ' + esc(l.email || '') + '<br>Plataforma: ' + esc(l.plataforma || '—') + ' · desde ' + data(l.desde) + '</div>';
  }
}
function grafico(linhas, kx, ky, fmt) {
  if (!linhas.length) return '<div class="vazio">Sem dados no período.</div>';
  const max = Math.max(...linhas.map(r => Number(r[ky] || 0)), 1);
  return '<div class="grafico">' + linhas.map(r => '<div style="height:' + Math.max(1.5, Number(r[ky] || 0) / max * 100) + '%" data-t="' + esc((kx === 'mes' ? r[kx] : data(r[kx])) + ': ' + fmt(r[ky])) + '"></div>').join('') + '</div>' +
    '<div class="eixo"><span>' + esc(kx === 'mes' ? linhas[0][kx] : data(linhas[0][kx])) + '</span><span>' + esc(kx === 'mes' ? linhas[linhas.length - 1][kx] : data(linhas[linhas.length - 1][kx])) + '</span></div>';
}
function tabela(corpo, cfg, linhas) {
  let ordem = null, dir = -1, filtro = '';
  const desenha = () => {
    let rows = linhas.filter(r => !filtro || cfg.cols.some(([k]) => String(r[k] == null ? '' : r[k]).toLowerCase().includes(filtro)));
    if (ordem) rows = rows.slice().sort((a, b) => { const x = a[ordem], y = b[ordem]; const nx = Number(x), ny = Number(y); return (isFinite(nx) && isFinite(ny) && x !== '' && y !== '' ? nx - ny : String(x || '').localeCompare(String(y || ''))) * dir; });
    const tb = corpo.querySelector('tbody');
    tb.innerHTML = rows.length ? rows.map((r, i) => '<tr' + (r.loja_id ? ' class="clicavel" data-i="' + linhas.indexOf(r) + '"' : '') + '>' + cfg.cols.map(([k, , f]) => '<td' + (f && f !== 'url' && f !== 'data' ? ' class="num"' : '') + '>' + (f ? FMT[f](r[k]) : esc(r[k] == null ? '—' : r[k])) + '</td>').join('') + '</tr>').join('')
      : '<tr><td colspan="' + cfg.cols.length + '" class="vazio">Nada encontrado.</td></tr>';
    tb.querySelectorAll('tr.clicavel').forEach(tr => tr.addEventListener('click', () => { const r = linhas[+tr.dataset.i]; vaiPara({ tipo: 'loja', id: r.loja_id, nome: r.loja }); }));
    corpo.querySelector('.contagem').textContent = rows.length + (rows.length === 1 ? ' item' : ' itens') + (linhas.some(r => r.loja_id) ? ' · clique numa loja para ver a ficha' : '');
  };
  corpo.innerHTML = (cfg.graf ? grafico(linhas, cfg.graf[0], cfg.graf[1], FMT[cfg.graf[2]]) : '') +
    (linhas.length > 8 ? '<input class="busca" placeholder="Buscar…" aria-label="Buscar na lista">' : '') +
    '<div class="secao contagem" style="margin-top:4px"></div>' +
    '<table><thead><tr>' + cfg.cols.map(([k, t, f]) => '<th data-k="' + k + '"' + (f && f !== 'url' && f !== 'data' ? ' class="num"' : '') + '>' + esc(t) + '</th>').join('') + '</tr></thead><tbody></tbody></table>';
  const busca = corpo.querySelector('.busca'); if (busca) busca.addEventListener('input', () => { filtro = busca.value.trim().toLowerCase(); desenha(); });
  corpo.querySelectorAll('th').forEach(th => th.addEventListener('click', () => { const k = th.dataset.k; dir = ordem === k ? -dir : -1; ordem = k; desenha(); }));
  desenha();
}

  const cfg = TOPICOS[args.p_topico];

// ───────────────── carregar ─────────────────
const aviso = $('aviso');
async function carrega() {
  try { const d = await rpc('pl_escritorio'); aplicaDados(d); atualizaTelas(d); aviso.style.display = 'none'; }
  catch (e) {
    const semLogin = /permiss|JWT|42501|401/.test((e.message || '') + ' ' + (e.code || ''));
    aviso.style.display = 'flex';
    aviso.innerHTML = semLogin ? 'Entre no painel de gestão para ver o escritório.<br><br><a href="index.html">Fazer login</a>' : 'Não consegui carregar os números: ' + esc(e.message);
  }
}
(async () => {
  if (!DEMO_MODE) {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { aviso.innerHTML = 'Entre no painel de gestão para ver o escritório.<br><br><a href="index.html">Fazer login</a>'; return; }
  }
  await carrega();
  if (!DEMO_MODE) setInterval(carrega, 5 * 60 * 1000);
})();
