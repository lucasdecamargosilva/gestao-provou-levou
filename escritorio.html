<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Escritório · Provou Levou</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env-config.js"></script>
<style>
  @font-face{font-family:'HelveticaNow';src:url('helveticanowdisplay-medium.ttf') format('truetype');font-display:swap}
  :root{
    --bg:#efeaf8; --card:#ffffff; --linha:rgba(23,18,31,.11);
    --ink:#17121f; --ink2:rgba(23,18,31,.74); --ink3:rgba(23,18,31,.58);
    --roxo:#7c3aed; --lilas:#a78bfa; --destaque:#6d28d9; --verde:#0d9668; --vermelho:#c2410c;
    --fonte:'HelveticaNow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fonte);-webkit-font-smoothing:antialiased}
  #cena{position:fixed;inset:0}
  #cena canvas{display:block}

  /* HUD do topo */
  .hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .marca{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:1px solid var(--linha);border-radius:16px;padding:12px 16px;min-width:230px;box-shadow:0 6px 24px rgba(76,29,149,.10)}
  .marca b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
  .marca small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
  .nivel-emp{display:flex;align-items:center;gap:10px;margin-top:10px}
  .nivel-emp .selo{background:linear-gradient(135deg,var(--lilas),var(--roxo));color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:5px 9px;white-space:nowrap}
  .barra{flex:1;height:7px;border-radius:9px;background:rgba(124,58,237,.14);overflow:hidden;min-width:90px}
  .barra i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--lilas),var(--roxo));transform:scaleX(0);transform-origin:left;transition:transform .8s}
  .acoes{display:flex;gap:8px}
  .btn{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:1px solid var(--linha);color:var(--ink2);font:inherit;font-size:12.5px;padding:9px 13px;border-radius:11px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:rgba(124,58,237,.4);color:var(--roxo)}

  /* Etiquetas 3D (CSS2D) */
  .tag{transform:translateY(-6px);pointer-events:auto;cursor:pointer;user-select:none}
  .tag .box{background:rgba(255,255,255,.92);border:1px solid var(--linha);border-radius:12px;padding:7px 10px 8px;box-shadow:0 6px 18px rgba(76,29,149,.14);min-width:148px;transition:transform .2s}
  .tag:hover .box{transform:translateY(-3px);border-color:rgba(124,58,237,.45)}
  .tag .top{display:flex;align-items:center;gap:7px}
  .tag .nv{font-size:11px;font-weight:700;color:#fff;border-radius:7px;padding:2px 6px}
  .tag .nome{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .tag .kpi{font-size:11.5px;color:var(--ink2);margin-top:4px;white-space:nowrap}
  .tag .barra{height:5px;margin-top:6px}
  .tag.sel .box{border-color:var(--roxo);box-shadow:0 0 0 3px rgba(124,58,237,.18),0 6px 18px rgba(76,29,149,.14)}

  /* Painel lateral */
  .painel{position:fixed;top:16px;right:16px;bottom:16px;width:360px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border:1px solid var(--linha);border-radius:18px;box-shadow:0 18px 50px rgba(76,29,149,.18);transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
  .painel.aberto{transform:none}
  .painel header{padding:18px 20px 12px;border-bottom:1px solid var(--linha);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .painel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .painel header small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}
  .painel .fechar{background:none;border:0;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1}
  .painel .corpo{padding:16px 20px;overflow:auto;flex:1}
  .painel .nivel-area{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kp{background:#faf8ff;border:1px solid var(--linha);border-radius:12px;padding:12px}
  .kp .n{display:block;font-size:21px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .kp .l{display:block;font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.35}
  .kp .v{font-size:11px;margin-top:4px;display:block}
  .kp .v.up{color:var(--verde)} .kp .v.down{color:var(--vermelho)}
  .kp.largo{grid-column:1/-1}
  .dica{margin-top:14px;background:#f5f0ff;border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
  .dica b{color:var(--destaque)}
  .painel footer{padding:14px 20px;border-top:1px solid var(--linha)}
  .painel footer a{display:block;text-align:center;background:var(--roxo);color:#fff;text-decoration:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:600}
  .painel footer a:hover{background:var(--destaque)}

  .aviso{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--bg);font-size:14px;color:var(--ink2);text-align:center;padding:24px}
  .aviso a{color:var(--roxo)}
  .ajuda{position:fixed;left:16px;bottom:16px;font-size:11.5px;color:var(--ink3);background:rgba(255,255,255,.75);border-radius:10px;padding:7px 10px;z-index:4}

  @media (max-width:700px){
    .marca{min-width:0;flex:1}
    .acoes .btn.oculta-mob{display:none}
    .painel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;height:62vh;transform:translateY(calc(100% + 30px))}
    .ajuda{display:none}
    .tag .box{min-width:0;padding:5px 8px}
    .tag .kpi,.tag .barra{display:none}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
</head>
<body>
<div id="cena"></div>

<div class="hud">
  <div class="marca">
    <b>Provou Levou · Escritório</b>
    <small id="atualizado">Carregando os números…</small>
    <div class="nivel-emp"><span class="selo" id="nivel-emp">Nível –</span><div class="barra"><i id="barra-emp"></i></div></div>
  </div>
  <div class="acoes">
    <button class="btn" id="btn-visao">Visão geral</button>
    <button class="btn" id="btn-atualizar">Atualizar</button>
    <a class="btn oculta-mob" href="index.html">Painel de gestão</a>
  </div>
</div>

<aside class="painel" id="painel" aria-live="polite">
  <header><div><h2 id="p-titulo">–</h2><small id="p-sub"></small></div><button class="fechar" id="p-fechar" aria-label="Fechar">×</button></header>
  <div class="corpo" id="p-corpo"></div>
  <footer id="p-rodape"></footer>
</aside>

<div class="ajuda">Clique numa área para ver os números · arraste para girar · role para aproximar</div>
<div class="aviso" id="aviso">Carregando o escritório…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ───────────────────────── Dados ─────────────────────────
const db = window.supabase.createClient(window.LOCAL_SUPABASE_URL, window.LOCAL_SUPABASE_KEY);
const aviso = document.getElementById('aviso');
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const num = v => Number(v || 0).toLocaleString('pt-BR');
const pct = (a, b) => (!b ? null : Math.round((a / b - 1) * 100));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// razão atual/anterior → nível 1..5 e progresso dentro do nível
function nivelPorRazao(r) {
  if (r == null || !isFinite(r)) return { n: 3, p: .5 };
  const faixas = [0, .75, .95, 1.05, 1.25, 1.6];
  let n = 1; for (let i = 1; i < 5; i++) if (r >= faixas[i]) n = i + 1;
  const lo = faixas[n - 1], hi = faixas[n];
  return { n, p: Math.max(.08, Math.min(1, (r - lo) / (hi - lo))) };
}
const razao = (a, b) => (b > 0 ? a / b : (a > 0 ? 1.3 : null));

let DADOS = null;
function calculaAreas(d) {
  const f = d.financeiro, pv = d.provador, mk = d.marketing, cm = d.comercial, at = d.atendimento;
  const rSeo = razao(mk.seo.cliques_28d, mk.seo.cliques_28d_ant);
  const rAds = razao(mk.ads.leads_7d, mk.ads.leads_7d_ant);
  const rMk = [rSeo, rAds].filter(x => x != null);
  const taxaEntrega = at.disparos_7d ? at.entregues_7d / at.disparos_7d : null;
  const retencao = (at.lojas_ativas + at.lojas_inativas) ? at.lojas_ativas / (at.lojas_ativas + at.lojas_inativas) : null;
  return {
    financeiro: { nivel: nivelPorRazao(razao(f.receita_mes, f.receita_mes_ant_ate_hoje)), kpi: brl(f.receita_mes) + ' no mês' },
    provador:   { nivel: nivelPorRazao(razao(pv.provas_30d, pv.provas_30d_ant)), kpi: num(pv.provas_hoje) + ' provas hoje' },
    marketing:  { nivel: nivelPorRazao(rMk.length ? rMk.reduce((a, b) => a + b, 0) / rMk.length : null), kpi: num(mk.ads.leads_7d) + ' leads de anúncio (7d)' },
    comercial:  { nivel: nivelPorRazao(razao(cm.clientes_novos_30d, cm.clientes_novos_30d_ant)), kpi: cm.clientes_novos_30d + ' clientes novos (30d)' },
    atendimento:{ nivel: nivelPorRazao(taxaEntrega == null ? retencao / .85 : ((taxaEntrega / .9) + (retencao / .85)) / 2), kpi: at.lojas_ativas + ' lojas ativas' }
  };
}

// ───────────────────────── Cena ─────────────────────────
const host = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
host.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#efeaf8');
scene.fog = new THREE.Fog('#efeaf8', 70, 140);

// Câmera ortográfica = visão isométrica "de maquete", igual à imagem escolhida
const aspect = innerWidth / innerHeight;
// enquadra o andar inteiro: em tela em pé (celular) quem manda é a largura
const viewPara = asp => Math.max(22, 26 / asp);
let VIEW = viewPara(aspect);
const camera = new THREE.OrthographicCamera(-VIEW * aspect, VIEW * aspect, VIEW, -VIEW, 0.1, 400);
const CASA = { pos: new THREE.Vector3(38, 40, 38), alvo: new THREE.Vector3(0, 0, 1), zoom: 1 };
camera.position.copy(CASA.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CASA.alvo);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minZoom = .6; controls.maxZoom = 3.2;
controls.maxPolarAngle = Math.PI * .42; controls.minPolarAngle = Math.PI * .12;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight('#ffffff', '#c9b8f0', 1.05));
const sol = new THREE.DirectionalLight('#fff4e8', 1.6);
sol.position.set(18, 32, 14);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 90 });
sol.shadow.bias = -0.0006;
scene.add(sol);

// ───────────── Materiais e peças reutilizáveis ─────────────
const M = c => new THREE.MeshStandardMaterial({ color: c, roughness: .82, metalness: .02 });
const mat = {
  parede: M('#f7f4fd'), paredeTopo: M('#ddd2f5'), madeira: M('#d9b48f'), mesa: M('#ffffff'), pe: M('#b9aed3'),
  tela: new THREE.MeshStandardMaterial({ color: '#1e1b3a', roughness: .4 }), vaso: M('#f1ecfa'), folha: M('#5fb37e'),
  cadeira: M('#8b7fb5'), vidro: new THREE.MeshStandardMaterial({ color: '#cfe8ff', transparent: true, opacity: .14, roughness: .1, depthWrite: false }),
  cofre: new THREE.MeshStandardMaterial({ color: '#6d5a9e', roughness: .35, metalness: .55 })
};
function caixa(w, h, d, m, x, y, z, r = 0.06) {
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 2, Math.min(r, Math.min(w, h, d) / 2.2)) : new THREE.BoxGeometry(w, h, d);
  const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; return o;
}
// textura de tela desenhada em canvas (gráficos/kanban/chat), barata e nítida
function telaTex(desenho, w = 512, h = 300) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); desenho(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { t, c, x };
}
function fundoTela(x, w, h, cor = '#1b1638') { x.fillStyle = cor; x.fillRect(0, 0, w, h); }
function graficoLinha(x, w, h, pts, cor = '#a78bfa') {
  fundoTela(x, w, h);
  x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1;
  for (let i = 1; i < 5; i++) { x.beginPath(); x.moveTo(20, h * i / 5); x.lineTo(w - 20, h * i / 5); x.stroke(); }
  const max = Math.max(...pts, 1); const px = i => 24 + i * (w - 48) / (pts.length - 1 || 1); const py = v => h - 26 - v / max * (h - 60);
  const grad = x.createLinearGradient(0, 0, 0, h); grad.addColorStop(0, cor + 'aa'); grad.addColorStop(1, cor + '00');
  x.beginPath(); x.moveTo(px(0), h - 26); pts.forEach((v, i) => x.lineTo(px(i), py(v))); x.lineTo(px(pts.length - 1), h - 26); x.fillStyle = grad; x.fill();
  x.beginPath(); pts.forEach((v, i) => i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))); x.strokeStyle = cor; x.lineWidth = 5; x.lineJoin = 'round'; x.stroke();
}
function barras(x, w, h, vals, cores) {
  fundoTela(x, w, h); const max = Math.max(...vals, 1); const bw = (w - 60) / vals.length;
  vals.forEach((v, i) => { const bh = v / max * (h - 70); x.fillStyle = cores[i % cores.length]; x.fillRect(30 + i * bw + 8, h - 30 - bh, bw - 16, bh); });
}
function monitor(g, x, z, rotY, tex) {
  const grupo = new THREE.Group();
  grupo.add(caixa(.9, .05, .5, mat.pe, 0, .78, 0, .02));
  const tela = new THREE.Mesh(new THREE.PlaneGeometry(1.0, .62), new THREE.MeshBasicMaterial({ map: tex || null, color: tex ? '#ffffff' : '#2b2552' }));
  tela.position.set(0, 1.18, -.05); grupo.add(tela);
  const tras = caixa(1.06, .68, .05, mat.tela, 0, 1.18, -.09, .02); grupo.add(tras);
  grupo.position.set(x, 0, z); grupo.rotation.y = rotY; g.add(grupo); return grupo;
}
function mesaTrabalho(g, x, z, rotY = 0, tex) {
  const m = new THREE.Group();
  m.add(caixa(2.0, .1, 1.05, mat.mesa, 0, .74, 0, .04));
  [[-.9, -.45], [.9, -.45], [-.9, .45], [.9, .45]].forEach(([a, b]) => m.add(caixa(.07, .72, .07, mat.pe, a, .36, b, 0)));
  const mon = monitor(m, 0, -.2, 0, tex); mon.scale.setScalar(1);
  const cad = new THREE.Group();
  cad.add(caixa(.6, .1, .6, mat.cadeira, 0, .48, 0, .05)); cad.add(caixa(.6, .6, .1, mat.cadeira, 0, .8, .3, .05)); cad.add(caixa(.08, .44, .08, mat.pe, 0, .22, 0, 0));
  cad.position.set(0, 0, .85); m.add(cad);
  m.position.set(x, 0, z); m.rotation.y = rotY; g.add(m); return m;
}
function planta(g, x, z, s = 1) {
  const p = new THREE.Group();
  p.add(caixa(.5, .5, .5, mat.vaso, 0, .25, 0, .12));
  const f = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 0), mat.folha); f.position.y = .95; f.castShadow = true; p.add(f);
  const f2 = new THREE.Mesh(new THREE.IcosahedronGeometry(.38, 0), mat.folha); f2.position.set(.25, 1.35, .1); f2.castShadow = true; p.add(f2);
  p.position.set(x, 0, z); p.scale.setScalar(s); g.add(p);
}
function quadroParede(g, x, y, z, rotY, w, h, tex) {
  const q = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  q.position.set(x, y, z); q.rotation.y = rotY; g.add(q);
  const moldura = caixa(w + .16, h + .16, .06, mat.tela, x, y, z, .03); moldura.rotation.y = rotY;
  moldura.position.add(new THREE.Vector3(-Math.sin(rotY) * .035, 0, -Math.cos(rotY) * .035)); g.add(moldura);
  return q;
}

// ───────────── Planta baixa: tudo num andar só ─────────────
// x → leste, z → sul. Paredes altas só no fundo (norte e oeste), como maquete aberta.
const W = 44, D = 32;
const piso = new THREE.Mesh(new RoundedBoxGeometry(W + 2, 1, D + 2, 3, .4), M('#ece4fb'));
piso.position.y = -.5; piso.receiveShadow = true; scene.add(piso);
const base = new THREE.Mesh(new RoundedBoxGeometry(W + 3.4, .6, D + 3.4, 3, .4), M('#d9cdf3'));
base.position.y = -1.05; scene.add(base);

const AREAS = [
  { key: 'financeiro', nome: 'Financeiro', sub: 'Faturamento, recebimentos e lucro', cor: '#c4b5fd', piso: '#e9e1ff', x: -12.5, z: -8.5, w: 17, d: 13 },
  { key: 'marketing', nome: 'Marketing', sub: 'SEO e tráfego pago', cor: '#93c5fd', piso: '#e0edff', x: 11.5, z: -8.5, w: 19, d: 13 },
  { key: 'provador', nome: 'Provador · Produto', sub: 'Provas, lojas usando e custo', cor: '#f9a8d4', piso: '#ffe4f1', x: -14, z: 7.5, w: 14, d: 15 },
  { key: 'comercial', nome: 'Comercial · CRM', sub: 'Leads, testes grátis e clientes novos', cor: '#86efac', piso: '#ddf7e6', x: 13.5, z: 3.5, w: 15, d: 9 },
  { key: 'atendimento', nome: 'Atendimento · Sucesso', sub: 'Lojas ativas, WhatsApp e retenção', cor: '#5eead4', piso: '#d8f6f1', x: 13.5, z: 11.5, w: 15, d: 7 }
];
const zonaGrupo = {};
const zonaPiso = {};
AREAS.forEach(a => {
  const g = new THREE.Group(); g.position.set(a.x, 0, a.z); g.userData.area = a.key; scene.add(g); zonaGrupo[a.key] = g;
  const p = new THREE.Mesh(new RoundedBoxGeometry(a.w - .3, .08, a.d - .3, 2, .03), new THREE.MeshStandardMaterial({ color: a.piso, roughness: .9, emissive: a.cor, emissiveIntensity: 0 }));
  p.position.y = .04; p.receiveShadow = true; p.userData.area = a.key; g.add(p); zonaPiso[a.key] = p;
  // mureta baixa de divisão nas bordas (com vão de porta)
  const alt = .9, esp = .22, meio = a.w / 2, fundo = a.d / 2;
  const mureta = M('#ffffff');
  const lado = (x1, z1, x2, z2) => { const len = Math.hypot(x2 - x1, z2 - z1); const m = caixa(x1 === x2 ? esp : len, alt, z1 === z2 ? esp : len, mureta, (x1 + x2) / 2, alt / 2, (z1 + z2) / 2, .05); g.add(m); };
  const vao = 2.4;
  lado(-meio, fundo, -vao / 2, fundo); lado(vao / 2, fundo, meio, fundo); // frente com porta
});

// paredes altas do fundo (norte e oeste), com rodapé roxo
const Hp = 4.2;
scene.add(caixa(W + 1, Hp, .4, mat.parede, 0, Hp / 2, -D / 2 - .5, .1));
scene.add(caixa(.4, Hp, D + 1, mat.parede, -W / 2 - .5, Hp / 2, 0, .1));

    '<div class="nivel-area"><span class="selo" style="background:linear-gradient(135deg,' + a.cor + ',#7c3aed);color:#fff;border-radius:10px;padding:5px 9px;font-weight:700;font-size:13px">Nível ' + ar.nivel.n + '</span><div class="barra"><i style="transform:scaleX(' + ar.nivel.p.toFixed(2) + ')"></i></div></div>' +
    '<div class="kpis">' + c.kpis + '</div>' + (c.dica ? '<div class="dica">' + c.dica + '</div>' : '');
  document.getElementById('p-rodape').innerHTML = '<a href="' + c.link[0] + '">' + esc(c.link[1]) + ' →</a>';
  painel.classList.add('aberto');
  Object.values(tags).forEach(t => t.classList.toggle('sel', t.dataset.area === key));
  if (!soAtualiza) {
    const alvo = new THREE.Vector3(a.x, 0, a.z);
    // no computador o painel ocupa a direita: empurra a área pra esquerda da tela
    if (innerWidth >= 700) { const dir = new THREE.Vector3().subVectors(camera.position, controls.target).setY(0).normalize(); alvo.add(new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(-5.5)); }
    else alvo.z += 4; // no celular o painel sobe de baixo: área vai pra cima
    voa(alvo, innerWidth < 700 ? 1.5 : 1.9);
  }
}
function fechaPainel() { painel.classList.remove('aberto'); delete painel.dataset.area; Object.values(tags).forEach(t => t.classList.remove('sel')); voa(CASA.alvo.clone(), 1); }
document.getElementById('p-fechar').addEventListener('click', fechaPainel);
document.getElementById('btn-visao').addEventListener('click', fechaPainel);
document.getElementById('btn-atualizar').addEventListener('click', carrega);

// animação suave da câmera até a área
let voo = null;
function voa(alvo, zoom) {
  const off = camera.position.clone().sub(controls.target);
  voo = { t: 0, de: controls.target.clone(), para: alvo, z0: camera.zoom, z1: zoom, off };
}

// clique no chão da área também abre
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(); let arrasto = null;
renderer.domElement.addEventListener('pointerdown', e => { arrasto = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!arrasto || Math.hypot(e.clientX - arrasto[0], e.clientY - arrasto[1]) > 6) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => { let o = h.object; while (o) { if (o.userData && o.userData.area) return true; o = o.parent; } return false; });
  if (hit) { let o = hit.object; while (o && !(o.userData && o.userData.area)) o = o.parent; abreArea(o.userData.area); }
});
let hoverArea = null;
renderer.domElement.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(zonaPiso), false)[0];
  const k = hit ? hit.object.userData.area : null;
  if (k !== hoverArea) { hoverArea = k; renderer.domElement.style.cursor = k ? 'pointer' : 'default'; }
});

// ───────────── Loop ─────────────
const relogio = new THREE.Clock();
function loop() {
  const dt = Math.min(relogio.getDelta(), .05), t = relogio.elapsedTime;
  pessoas.forEach(p => {
    p.t += p.vel * dt * 2; const { p: pos, dir } = posRota(p.rota, p.t);
    p.g.position.set(pos.x, Math.abs(Math.sin(t * 9 + p.vel * 100)) * .06, pos.z);
    p.g.rotation.y = Math.atan2(dir.x, dir.z);
  });
  placa.lookAt(camera.position.x, placa.getWorldPosition(new THREE.Vector3()).y, camera.position.z);
  placa.position.y = 5.2 + Math.sin(t * 1.4) * .12;
  anel.material.color.setHSL(.72, .8, .72 + Math.sin(t * 2) * .06);
  feixe.material.opacity = .07 + Math.sin(t * 2) * .025;
  const mg = zonaGrupo.marketing.userData.megafone; if (mg) mg.rotation.z = Math.sin(t * 3) * .06;
  (zonaGrupo.atendimento.userData.baloes || []).forEach((b, i) => { b.position.y = 2.6 + i * .2 + Math.sin(t * 2 + i) * .18; });
  if (hoverArea) { const pz = zonaPiso[hoverArea]; pz.material.emissiveIntensity += (0.38 - pz.material.emissiveIntensity) * .15; }
  if (voo) {
    voo.t = Math.min(1, voo.t + dt * 1.6); const e = 1 - Math.pow(1 - voo.t, 3);
    controls.target.lerpVectors(voo.de, voo.para, e); camera.position.copy(controls.target).add(voo.off);
    camera.zoom = voo.z0 + (voo.z1 - voo.z0) * e; camera.updateProjectionMatrix(); if (voo.t >= 1) voo = null;
  }
  controls.update();
  renderer.render(scene, camera); labels.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  const a = innerWidth / innerHeight; VIEW = viewPara(a);
  Object.assign(camera, { left: -VIEW * a, right: VIEW * a, top: VIEW, bottom: -VIEW }); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

// ───────────── Login + carregamento ─────────────
async function carrega() {
  const { data, error } = await db.rpc('pl_escritorio');
  if (error) {
    const semLogin = /permiss|JWT|42501|401/.test(error.message + ' ' + (error.code || ''));
    aviso.style.display = 'flex';
    aviso.innerHTML = semLogin ? 'Entre no painel de gestão para ver o escritório.<br><br><a href="index.html">Fazer login</a>' : 'Não consegui carregar os números: ' + esc(error.message);
    return;
  }
  aviso.style.display = 'none';
  aplicaDados(typeof data === 'string' ? JSON.parse(data) : data);
}
// ?demo=1 → números de exemplo (sem login), só para ver/testar a cena
const DEMO = {
  gerado_em: new Date().toISOString(),
  financeiro: { receita_mes: 36000, receita_mes_ant_ate_hoje: 32000, receita_mes_ant: 58000, recebido_30d: 46000, pagamentos_mes: 54, lucro_ultimo_mes: 27000, por_dia: Array.from({ length: 25 }, (_, i) => ({ d: i, v: 800 + (i * 377) % 2200 })) },
  provador: { provas_hoje: 1800, provas_7d: 13000, provas_30d: 67000, provas_30d_ant: 70000, lojas_com_prova_7d: 66, custo_30d: 16750 },
  marketing: { seo: { cliques_28d: 120, cliques_28d_ant: 100, impressoes_28d: 4000, posicao_media: 12.4, ultimo_dia: '2026-09-24' }, ads: { gasto_7d: 350, gasto_7d_ant: 320, leads_7d: 60, leads_7d_ant: 57, cliques_7d: 900 } },
  comercial: { leads_30d: 459, leads_30d_ant: 234, em_teste: 88, testes_novos_30d: 73, clientes_novos_30d: 17, clientes_novos_30d_ant: 7 },
  atendimento: { lojas_ativas: 62, lojas_inativas: 19, disparos_7d: 3956, entregues_7d: 3780, respostas_7d: 379 }
};
(async () => {
  if (new URLSearchParams(location.search).get('demo') === '1') { aviso.style.display = 'none'; aplicaDados(DEMO); document.getElementById('atualizado').textContent = 'Modo demonstração · números de exemplo'; return; }
  const { data: { session } } = await db.auth.getSession();
  if (!session) { aviso.innerHTML = 'Entre no painel de gestão para ver o escritório.<br><br><a href="index.html">Fazer login</a>'; return; }
  await carrega();
  setInterval(carrega, 5 * 60 * 1000); // atualiza sozinho a cada 5 min
})();
