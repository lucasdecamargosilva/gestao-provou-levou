<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tráfego · Provou Levou</title>
<link rel="icon" href="logo.png">
<script src="env-config.js"></script>
<style>
  :root{
    --bg:#f6f5f9; --card:#fff; --linha:rgba(23,18,31,.11);
    /* no escuro .62/.38 bastava; sobre branco esses alfas caem para ~3:1, daí os valores mais altos */
    --ink:#17121f; --ink2:rgba(23,18,31,.74); --ink3:rgba(23,18,31,.60);
    /* sutil = fundos de hover/trilho; no claro escurece em vez de clarear */
    --sutil:rgba(23,18,31,.04); --sutil2:rgba(23,18,31,.07);
    --roxo:#7c3aed; --lilas:#a78bfa; --verde:#0d9668; --amarelo:#b8860b;
    /* o lilás não tem contraste sobre branco: número em destaque usa o roxo escuro */
    --destaque:#6d28d9;
    --fonte:'HelveticaNow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fonte);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:28px 24px 72px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-.03em}
  .sub{margin:6px 0 0;font-size:12.5px;color:var(--ink3)}
  .periodo{display:flex;gap:6px}
  .periodo button{background:var(--sutil);border:1px solid var(--linha);color:var(--ink2);
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;transition:.2s}
  .periodo button:hover{border-color:rgba(167,139,250,.4)}
  .periodo button[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;
    box-shadow:0 1px 2px rgba(23,18,31,.04)}
  .kpi .n{display:block;font-size:30px;font-weight:400;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .l{display:block;margin-top:8px;font-size:11.5px;color:var(--ink3);line-height:1.4}
  .kpi.destaque .n{color:var(--destaque)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:20px;
    box-shadow:0 1px 2px rgba(23,18,31,.04)}
  .card h2{margin:0 0 16px;font-size:13px;font-weight:600;letter-spacing:-.01em}
  .card h2 span{float:right;font-weight:400;color:var(--ink3);font-size:11.5px}
  .full{grid-column:1/-1}

  /* série diária */
  .serie{display:flex;align-items:flex-end;gap:3px;height:150px}
  .serie .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative}
  .serie .b1{background:linear-gradient(180deg,var(--lilas),var(--roxo));border-radius:3px 3px 0 0;min-height:2px}
  .serie .b2{background:rgba(23,18,31,.16);border-radius:3px 3px 0 0;min-height:2px}
  .serie .col:hover .b1{filter:brightness(1.2)}
  .serie .col .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--linha);border-radius:8px;padding:7px 10px;white-space:nowrap;
    box-shadow:0 6px 20px rgba(23,18,31,.13);
    font-size:11px;color:var(--ink2);z-index:5;margin-bottom:6px}
  .serie .col:hover .tip{display:block}
  .legenda{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--ink3)}
  .legenda i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:0}

  /* listas com barra */
  .lista{list-style:none;margin:0;padding:0}
  .lista li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sutil2)}
  .lista li:last-child{border-bottom:0}
  .lista .nome{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lista .barra{grid-column:1/-1;height:3px;background:var(--sutil2);border-radius:2px;overflow:hidden}
  .lista .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--roxo),var(--lilas));border-radius:2px}
  .lista .num{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}

  .vazio{padding:26px 0;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.6}
  .erro{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.28);color:#b91c46;
    border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.6}
  .erro code{background:rgba(23,18,31,.07);padding:2px 6px;border-radius:4px;font-size:12px}
  .tabela-wrap{overflow-x:auto}
  .tabela{width:100%;border-collapse:collapse;font-size:12.5px}
  .tabela th{text-align:left;font-weight:600;color:var(--ink3);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:0 12px 10px 0;border-bottom:1px solid var(--linha);white-space:nowrap}
  .tabela td{padding:12px 12px 12px 0;border-bottom:1px solid var(--sutil2);color:var(--ink2);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .tabela td b{display:block;color:var(--ink);font-weight:600;font-size:13px}
  .tabela td small{display:block;margin-top:2px;color:var(--ink3);font-size:11px}
  .tabela td:first-child{white-space:normal;min-width:190px}
  .tabela .destaque-num{color:var(--destaque);font-weight:600}
  .tabela tbody tr:hover td{background:var(--sutil)}

  .insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .insights li{font-size:13px;line-height:1.55;color:var(--ink2);padding:12px 14px;border-radius:10px;
    border-left:3px solid var(--linha);background:var(--sutil)}
  .insights li b{color:var(--ink)}
  .insights li.bom{border-left-color:var(--verde)}
  .insights li.ruim{border-left-color:#f43f5e}
  .insights li.neutro{border-left-color:var(--amarelo)}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tráfego &amp; leads</h1>
      <p class="sub" id="atualizado">carregando…</p>
    </div>
    <div class="periodo" id="periodo">
      <button data-dias="7">7 dias</button>
      <button data-dias="30" aria-pressed="true">30 dias</button>
      <button data-dias="90">90 dias</button>
    </div>
  </header>

  <div id="conteudo"><p class="sub">Carregando dados…</p></div>
</div>

<script>
(function () {
  var URL = (window.LOCAL_SUPABASE_URL || window.SUPABASE_URL || '').replace(/\/$/, '');
  var KEY = window.LOCAL_SUPABASE_KEY || window.SUPABASE_KEY || '';
  var alvo = document.getElementById('conteudo');
  var dias = 30;

  var nf = new Intl.NumberFormat('pt-BR');
  function pct(a, b) { return b > 0 ? (a / b * 100).toFixed(1).replace('.', ',') + '%' : '—'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); }

  function barras(itens, campoNome, campoValor, campoExtra) {
    if (!itens.length) return '<p class="vazio">Sem dados no período.</p>';
    var max = Math.max.apply(null, itens.map(function (i) { return i[campoValor] || 0; })) || 1;
    return '<ul class="lista">' + itens.map(function (i) {
      var v = i[campoValor] || 0;
      var extra = campoExtra && i[campoExtra] != null ? ' · ' + nf.format(i[campoExtra]) + ' únicos' : '';
      return '<li><span class="nome" title="' + esc(i[campoNome]) + '">' + esc(i[campoNome]) + '</span>' +
             '<span class="num">' + nf.format(v) + extra + '</span>' +
             '<span class="barra"><i style="width:' + (v / max * 100) + '%"></i></span></li>';
    }).join('') + '</ul>';
  }

  function serie(dados) {
    if (!dados.length) return '<p class="vazio">Sem dados no período.</p>';
    var max = Math.max.apply(null, dados.map(function (d) { return Math.max(d.sessoes || 0, d.cliques || 0); })) || 1;
    return '<div class="serie">' + dados.map(function (d) {
      var dia = d.dia.slice(8, 10) + '/' + d.dia.slice(5, 7);
      return '<div class="col">' +
        '<span class="tip">' + dia + ' · ' + nf.format(d.sessoes) + ' sessões · ' + nf.format(d.cliques) + ' cliques</span>' +
        '<span class="b2" style="height:' + ((d.cliques || 0) / max * 100) + '%"></span>' +
        '<span class="b1" style="height:' + ((d.sessoes || 0) / max * 100) + '%"></span>' +
      '</div>';
    }).join('') + '</div>' +
    '<div class="legenda"><span><i style="background:linear-gradient(180deg,#a78bfa,#7c3aed)"></i>Sessões</span>' +
    '<span><i style="background:rgba(23,18,31,.16)"></i>Cliques no WhatsApp</span></div>';
  }

  function moeda(v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ','); }

  function tabelaAds(itens) {
    if (!itens || !itens.length) return '<p class="vazio">Sem dados de anúncios no período.</p>';
    return '<div class="tabela-wrap"><table class="tabela"><thead><tr>' +
      '<th>Criativo</th><th>Investido</th><th>Cliques</th><th>Chegou</th><th>Leads</th><th>Custo/lead</th><th>CTR</th>' +
      '</tr></thead><tbody>' +
      itens.map(function (i) {
        var cpl = i.custo_por_lead;
        return '<tr>' +
          '<td><b>' + esc(i.nome || '(sem nome)') + '</b><small>' + esc(i.conjunto || i.campanha || '') + '</small></td>' +
          '<td>' + moeda(i.investido) + '</td>' +
          '<td>' + nf.format(i.cliques || 0) + '</td>' +
          '<td>' + (i.pct_chegou != null ? i.pct_chegou + '%' : '—') + '</td>' +
          '<td>' + nf.format(i.leads || 0) + '</td>' +
          '<td class="' + (cpl == null ? '' : 'destaque-num') + '">' + (cpl != null ? moeda(cpl) : '—') + '</td>' +
          '<td>' + (i.ctr != null ? i.ctr + '%' : '—') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  // Le os numeros e escreve o que eles dizem — o que pausar, o que escalar.
  function insights(criativos, ads) {
    var com = (criativos || []).filter(function (c) { return (c.investido || 0) > 0; });
    if (com.length < 1) return '<p class="vazio">Sem investimento no período para comparar.</p>';
    var itens = [];

    var comLead = com.filter(function (c) { return c.custo_por_lead != null; })
                     .sort(function (a, b) { return a.custo_por_lead - b.custo_por_lead; });
    if (comLead.length >= 2) {
      var bom = comLead[0], ruim = comLead[comLead.length - 1];
      var vezes = (ruim.custo_por_lead / bom.custo_por_lead).toFixed(1).replace('.', ',');
      itens.push({ tom: 'bom', txt: '<b>' + esc(bom.nome) + '</b> traz lead por ' + moeda(bom.custo_por_lead) +
        ' — ' + vezes + '× mais barato que <b>' + esc(ruim.nome) + '</b> (' + moeda(ruim.custo_por_lead) + '). ' +
        'Vale mover verba do segundo para o primeiro.' });
    } else if (comLead.length === 1) {
      itens.push({ tom: 'neutro', txt: '<b>' + esc(comLead[0].nome) + '</b> está a ' + moeda(comLead[0].custo_por_lead) + ' por lead. Sem outro criativo com lead no período para comparar.' });
    }

    var semLead = com.filter(function (c) { return !c.leads && c.investido > 20; });
    semLead.forEach(function (c) {
      itens.push({ tom: 'ruim', txt: '<b>' + esc(c.nome) + '</b> gastou ' + moeda(c.investido) + ' e não trouxe nenhum lead. Candidato a pausar.' });
    });

    com.forEach(function (c) {
      if (c.pct_chegou != null && c.pct_chegou < 50 && c.cliques > 30) {
        itens.push({ tom: 'ruim', txt: '<b>' + esc(c.nome) + '</b>: só ' + c.pct_chegou + '% dos cliques chegam a abrir a página. ' +
          'Clique caro que não vira visita costuma ser criativo que promete outra coisa, ou clique acidental no formato.' });
      }
    });

    var ctrAlto = com.filter(function (c) { return c.ctr > 5 && c.custo_por_lead != null; })
                     .sort(function (a, b) { return b.custo_por_lead - a.custo_por_lead; })[0];
    if (ctrAlto && comLead.length >= 2 && ctrAlto.nome === comLead[comLead.length - 1].nome) {
      itens.push({ tom: 'neutro', txt: '<b>' + esc(ctrAlto.nome) + '</b> tem CTR alto (' + ctrAlto.ctr + '%) mas o lead mais caro. ' +
        'Chama atenção e não entrega — o problema está entre o anúncio e a página, não no alcance.' });
    }

    if (ads && ads.cliques_link > 0) {
      var chegada = (ads.pageviews / ads.cliques_link * 100);
      itens.push({ tom: chegada >= 70 ? 'bom' : 'ruim',
        txt: 'No total, <b>' + chegada.toFixed(0) + '%</b> dos cliques no anúncio abriram a página' +
             (chegada >= 70 ? ' — dentro do saudável.' : ' — abaixo do esperado (o normal é 60–80%).') });
    }

    return '<ul class="insights">' + itens.map(function (i) {
      return '<li class="' + i.tom + '">' + i.txt + '</li>';
    }).join('') + '</ul>';
  }

  function funil(ads, r) {
    var etapas = [
      { nome: 'Cliques no anúncio', v: ads.cliques_link || 0 },
      { nome: 'Carregaram a página', v: ads.pageviews || 0 },
      { nome: 'Sessões no site', v: r.sessoes || 0 },
      { nome: 'Clicaram no WhatsApp', v: r.sessoes_que_clicaram || 0 }
    ].filter(function (x) { return x.v > 0; });
    if (etapas.length < 2) return '<p class="vazio">Precisa dos dados da Meta e de cliques registrados para montar o funil.</p>';
    var topo = etapas[0].v;
    return '<ul class="lista">' + etapas.map(function (x, i) {
      var perda = i > 0 ? ' · ' + pct(x.v, etapas[i - 1].v) + ' da etapa anterior' : '';
      return '<li><span class="nome">' + x.nome + perda + '</span>' +
             '<span class="num">' + nf.format(x.v) + '</span>' +
             '<span class="barra"><i style="width:' + (x.v / topo * 100) + '%"></i></span></li>';
    }).join('') + '</ul>';
  }

  function pinta(d) {
    var r = d.resumo || {};
    var taxa = pct(r.sessoes_que_clicaram, r.sessoes);

    document.getElementById('atualizado').textContent =
      'Últimos ' + d.periodo_dias + ' dias · atualizado ' + new Date(d.atualizado_em).toLocaleString('pt-BR');

    var ads = d.ads || {};
    var custoSessao = (r.sessoes > 0 && ads.investido > 0) ? 'R$ ' + (ads.investido / r.sessoes).toFixed(2).replace('.', ',') : '—';
    var custoClique = (r.cliques_unicos > 0 && ads.investido > 0) ? 'R$ ' + (ads.investido / r.cliques_unicos).toFixed(2).replace('.', ',') : '—';
    var chegada = pct(ads.pageviews, ads.cliques_link);

    var blocoAds = ads.investido > 0
      ? '<div class="kpis">' +
          '<div class="kpi"><span class="n">R$ ' + nf.format(Math.round(ads.investido)) + '</span><span class="l">investido na Meta</span></div>' +
          '<div class="kpi"><span class="n">' + custoSessao + '</span><span class="l">por sessao no site</span></div>' +
          '<div class="kpi destaque"><span class="n">' + custoClique + '</span><span class="l">por clique no WhatsApp</span></div>' +
          '<div class="kpi"><span class="n">' + chegada + '</span><span class="l">dos cliques no anuncio carregaram a pagina</span></div>' +
        '</div>'
      : '<div class="card" style="margin-bottom:12px"><h2>Meta Ads</h2><p class="vazio">Sem dados ainda. A coleta roda todo dia as 06:20 — ' +
        'se ja passou disso, confira se a tabela <code>meta_ads_insights</code> foi criada.</p></div>';

    alvo.innerHTML =
      blocoAds +
      '<div class="kpis">' +
        '<div class="kpi"><span class="n">' + nf.format(r.sessoes || 0) + '</span><span class="l">sessões no site</span></div>' +
        '<div class="kpi"><span class="n">' + nf.format(r.cliques_unicos || 0) + '</span><span class="l">cliques no WhatsApp (1 por sessão)</span></div>' +
        '<div class="kpi destaque"><span class="n">' + taxa + '</span><span class="l">das sessões clicaram no WhatsApp</span></div>' +
        '<div class="kpi"><span class="n">' + nf.format((r.cliques || 0) - (r.cliques_unicos || 0)) + '</span><span class="l">recliques (mesma sessão, outro botão)</span></div>' +
      '</div>' +

      '<div class="grid">' +
        '<div class="card full"><h2>Dia a dia<span>sessões vs cliques</span></h2>' + serie(d.por_dia || []) + '</div>' +
        '<div class="card"><h2>Campanhas<span>sessões</span></h2>' + barras(d.por_campanha || [], 'campanha', 'sessoes') + '</div>' +
        '<div class="card"><h2>Origens<span>sessões</span></h2>' + barras(d.por_fonte || [], 'fonte', 'sessoes') + '</div>' +
        '<div class="card"><h2>Botões clicados<span>cliques</span></h2>' + barras(d.por_botao || [], 'botao', 'cliques', 'unicos') + '</div>' +
        '<div class="card"><h2>Dispositivo<span>sessões</span></h2>' + barras(d.por_dispositivo || [], 'dispositivo', 'sessoes') + '</div>' +
        '<div class="card full"><h2>Funil<span>do anúncio até a conversa</span></h2>' + funil(ads, r) + '</div>' +
        '<div class="card full"><h2>Criativos<span>ordenado por investimento</span></h2>' + tabelaAds(d.ads_criativos) + '</div>' +
        '<div class="card full"><h2>Campanhas na Meta<span>investimento e retorno</span></h2>' + tabelaAds(d.ads_campanhas) + '</div>' +
        '<div class="card full"><h2>O que os números dizem</h2>' + insights(d.ads_criativos, ads) + '</div>' +
      '</div>';
  }

  function carrega() {
    alvo.innerHTML = '<p class="sub">Carregando dados…</p>';
    fetch(URL + '/rest/v1/rpc/painel_trafego', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_dias: dias })
    })
    .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(r.status + ' ' + t); }); return r.json(); })
    .then(pinta)
    .catch(function (e) {
      alvo.innerHTML = '<div class="erro"><strong>Não consegui carregar.</strong><br>' + esc(e.message) +
        '<br><br>Se aparecer <code>painel_trafego does not exist</code>, falta rodar <code>db/rpc_painel_trafego.sql</code> no SQL Editor do Supabase.</div>';
    });
  }

  document.getElementById('periodo').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    dias = parseInt(b.getAttribute('data-dias'), 10);
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    carrega();
  });

  carrega();
})();
</script>
</body>
</html>
